services:
  web:
    image: node:22-alpine
    working_dir: /app
    restart: on-failure
    volumes:
      - .:/app
      - submissions:/data
    ports:
      - "3000:3000"
    command: ["node", "--watch", "server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  submissions:
